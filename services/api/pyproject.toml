[project]
name = "research-api"
version = "0.1.0"
description = "Product B FastAPI backend (modular monolith)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.118",
    "python-multipart>=0.0.20",
    "pypdf>=6.0",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pgvector>=0.4",
    "redis>=6.4",
    "celery[redis]>=5.5",
    "jsonschema>=4.25",
    "referencing>=0.36",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL database (DATABASE_URL)"]
addopts = "-ra --strict-markers"
