# Local-first stack: `docker compose up --build` then open http://localhost:3000
name: product-b

x-backend: &backend
  build:
    context: .
    dockerfile: infra/docker/python.Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research}:${POSTGRES_PASSWORD:-research}@postgres:5432/${POSTGRES_DB:-research}
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /data/storage
    # Deterministic local mock AI provider; off unless explicitly enabled (ADR-010).
    AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-false}
    AI_MOCK_MODE: ${AI_MOCK_MODE:-ok}
    AI_DEFAULT_PROFILE: ${AI_DEFAULT_PROFILE:-anthropic-default}
    # Selective cloud workspace (ADR-023): off unless explicitly configured.
    CLOUD_WORKSPACE_ADAPTER: ${CLOUD_WORKSPACE_ADAPTER:-none}
    CLOUD_WORKSPACE_ROOT: /data/cloud-workspace

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: ${POSTGRES_DB:-research}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - source-storage:/data/storage
      - cloud-workspace:/data/cloud-workspace
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["celery", "-A", "research_worker.app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - source-storage:/data/storage

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
  source-storage:
  cloud-workspace:
