name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: verify-tag-on-main
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: verify-tag-on-main
    uses: ./.github/workflows/e2e.yml

  security:
    needs: verify-tag-on-main
    uses: ./.github/workflows/security.yml

  images:
    # Versioned container images for the backend (API, worker, migrations) and the web app (#60).
    needs: [ci, e2e, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: product-b-backend, dockerfile: infra/docker/python.Dockerfile }
          - { name: product-b-web, dockerfile: infra/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.ref }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

  publish:
    needs: [ci, e2e, security, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Source bundle
        run: git archive --format=tar.gz --prefix="product-b-${GITHUB_REF_NAME}/" -o "product-b-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Release notes from CHANGELOG.md
        run: |
          # Older tags predate CHANGELOG.md; their notes are the generated ones alone.
          touch notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v tag="[${GITHUB_REF_NAME}]" 'index($0, "## " tag) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then echo "::warning::no CHANGELOG.md section for ${GITHUB_REF_NAME}"; fi
          printf '\nImages: `ghcr.io/%s/product-b-backend:%s`, `ghcr.io/%s/product-b-web:%s`\n' \
            "${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_REF_NAME" "${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_REF_NAME" >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: product-b-${{ github.ref_name }}.tar.gz
