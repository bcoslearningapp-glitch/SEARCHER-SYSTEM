name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: verify-tag-on-main
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: verify-tag-on-main
    uses: ./.github/workflows/e2e.yml

  security:
    needs: verify-tag-on-main
    uses: ./.github/workflows/security.yml

  publish:
    needs: [ci, e2e, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Source bundle
        run: git archive --format=tar.gz --prefix="product-b-${GITHUB_REF_NAME}/" -o "product-b-${GITHUB_REF_NAME}.tar.gz" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: product-b-${{ github.ref_name }}.tar.gz
