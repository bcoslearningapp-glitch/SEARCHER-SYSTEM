name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Start isolated stack
        # The mock provider simulates an outage for the provider-outage flow (PRD §73 flow 9).
        env:
          AI_MOCK_ENABLED: "true"
          AI_MOCK_MODE: unavailable
          AI_DEFAULT_PROFILE: mock
        run: docker compose up --build --detach --wait --wait-timeout 300
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: tests/e2e/package-lock.json }
      - working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/playwright-report, retention-days: 7 }
      - if: always()
        run: docker compose down --volumes
